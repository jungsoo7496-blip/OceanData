# CI_Pipeline (01번 요구사항 9). 하나라도 실패하면 병합하지 않는다.
name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements.txt
      - run: make contracts-check
      - run: make traceability

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 tools/check_secrets.py
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact -v

  backend:
    # PG16 클라이언트를 기본 저장소에서 제공하는 LTS를 사용한다 (08번, ADR-0022).
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgresql+pg8000://marine_owner:ci-owner@127.0.0.1:5432/marine
      PG_DUMP_BIN: /usr/lib/postgresql/16/bin/pg_dump
      PG_RESTORE_BIN: /usr/lib/postgresql/16/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: PostgreSQL (PostGIS + pgvector, 개발 이미지와 같음)
        run: |
          docker build -t marine-postgres:ci deploy/compose/postgres
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=marine_owner -e POSTGRES_PASSWORD=ci-owner \
            -e POSTGRES_DB=marine -e APP_DB_PASSWORD=ci-app marine-postgres:ci
          for i in $(seq 1 60); do docker exec pg pg_isready -U marine_owner -d marine && break; sleep 1; done
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client-16
      - name: 백업 런타임 이미지·PG16 도구 확인
        run: |
          docker build -t marine-api:ci -f backend/Dockerfile .
          docker run --rm marine-api:ci /usr/lib/postgresql/16/bin/pg_dump --version
          docker run --rm marine-api:ci /usr/lib/postgresql/16/bin/pg_restore --version
      - run: pip install -e "backend[dev]"
      - name: 수용·릴리스 도구 회귀 시험
        run: python -m unittest discover -s tools/tests -q
      - name: 린트·타입·정적 보안
        working-directory: backend
        run: |
          ruff check app tests
          mypy app
          bandit -q -ll -r app -x app/db/migrations
      - name: 마이그레이션 up → down → up (01번 요구사항 5.3)
        working-directory: backend
        env: {MIGRATION_DATABASE_URL: "${{ env.TEST_DATABASE_URL }}"}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic downgrade base
      - name: 시험 (단위·통합·계약·수용)
        working-directory: backend
        run: pytest -q
      - name: 의존성 취약점
        working-directory: backend
        run: pip-audit --skip-editable
      - name: 라이선스 허용 목록 (런타임 의존성만)
        run: |
          python -m venv /tmp/runtime && /tmp/runtime/bin/pip install -q ./backend
          python tools/check_licenses.py --python /tmp/runtime/bin/python

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:api  # 계약 → TS 타입 재생성 일치 (09번 작업 16)
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  agent:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: agent}}
    env: {MQTT_TEST_BROKER: "tcp://127.0.0.1:1883"}
    steps:
      - name: 개발용 MQTT 브로커 (07번 MQTT 플러그인 시험)
        working-directory: .
        run: docker run -d -p 1883:1883 eclipse-mosquitto:2.0.20 mosquitto -c /mosquitto-no-auth.conf
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26.10", cache-dependency-path: agent/go.sum}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 계약 SDK 재생성 일치 검사
        working-directory: .
        run: |
          pip install -r tools/requirements.txt
          python tools/generate_agent_api.py --check
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: GOOS=windows go build -o /dev/null ./cmd/marine-agent
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # G304·G703: 관리자가 설정한 감시 폴더·CLI 인자로 받은 로컬 경로를 읽는 것이 이 도구의 기능이다
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -exclude=G304,G703 ./...

  agent-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults: {run: {working-directory: agent}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.26.10", cache-dependency-path: agent/go.sum}
      - name: Windows DPAPI·기동 복원·강제 종료·진단 회귀시험
        run: go test -count=1 -timeout 3m ./internal/config ./internal/update ./internal/core ./cmd/marine-agent
      - run: go vet ./...
      - run: go build ./cmd/marine-agent
