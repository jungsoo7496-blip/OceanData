[project]
name = "marine-platform"
version = "0.1.0"
description = "해양 실증데이터 플랫폼 API·워커"
requires-python = ">=3.12"
# 라이선스 허용 목록(tech.md 3장) 안의 패키지만 둔다. psycopg(LGPL) 대신 pg8000(BSD-3)을 쓴다.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "pg8000>=1.31,<2",
  "boto3>=1.34,<2",
  "prometheus-client>=0.20,<1",
  "pyjwt[crypto]>=2.9,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",
  "jsonschema>=4.18,<5",
  "pyyaml>=6.0",
  "referencing>=0.35",
  # 보고서 내보내기 (10번): XLSX는 openpyxl(MIT), PDF는 WeasyPrint(BSD-3, 시스템 pango 필요) — ADR-0018
  "openpyxl>=3.1,<4",
  "weasyprint>=70,<71",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "moto[s3,server]>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "types-PyYAML",
  "boto3-stubs[s3]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"app/db/migrations/**" = ["E501", "S608", "W291", "I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["app/db/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: PostgreSQL·S3가 필요한 시험 (TEST_DATABASE_URL 필요)",
  "acceptance: 수용시험 케이스",
  "covers(*ids): 이 시험이 덮는 docs/ACCEPTANCE.md 세부 ID (17번 수용시험 보고)",
]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]
