components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 사용자는 Keycloak OIDC 액세스 토큰, 기기·기관 서버는 /v1/auth/token에서 받은 단기 토큰.

  headers:
    RequestId:
      description: 요청 추적 ID (ULID). 요청에 있으면 그대로 돌려준다.
      schema: {$ref: './schemas/common.schema.json#/$defs/ulid'}
    RetryAfter:
      description: 다시 시도할 때까지 기다릴 초
      schema: {type: integer, minimum: 1}

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 512}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 같은 키·같은 본문은 처음 응답을 다시 준다 (Idempotent-Replayed 헤더). 같은 키·다른 본문은 409 IDEMPOTENCY_CONFLICT. 24시간 보관.
      schema: {type: string, minLength: 8, maxLength: 128}
    SessionId:
      name: session_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/session_id'}
    RecordId:
      name: record_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/record_id'}
    ReportId:
      name: report_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/report_id'}
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/device_id'}
    AssetId:
      name: asset_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/upload_id'}
    EventId:
      name: event_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/event_id'}
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/dataset_id'}
    DatasetVersionId:
      name: dataset_version_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/dataset_version_id'}
    AccessRequestId:
      name: access_request_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/access_request_id'}
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/webhook_id'}
    WebhookSignature:
      name: X-Signature
      in: header
      required: true
      description: 'hex(HMAC-SHA256(secret, timestamp + "." + body))'
      schema: {type: string, pattern: '^[0-9a-f]{64}$'}
    WebhookTimestamp:
      name: X-Signature-Timestamp
      in: header
      required: true
      description: 유닉스 초. 수신 측은 허용 오차(기본 5분) 밖이면 거부한다.
      schema: {type: integer}
    WebhookEventId:
      name: X-Event-Id
      in: header
      required: true
      schema: {$ref: './schemas/common.schema.json#/$defs/ulid'}

  responses:
    BadRequest:
      description: 입력 형식 오류 (VALIDATION_ERROR)
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            validation:
              externalValue: ./examples/problem.validation-error.json
    Unauthorized:
      description: 인증 실패·만료·폐기된 자격증명 (UNAUTHENTICATED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: 같은 기관 안에서 권한 부족 (FORBIDDEN) 또는 다중 인증 필요 (MFA_REQUIRED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: 없음 또는 다른 기관 리소스 (둘을 구분하지 않는다)
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: CONFLICT, IDEMPOTENCY_CONFLICT, INVALID_STATE_TRANSITION, QUOTA_EXCEEDED
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Gone:
      description: 만료된 업로드 세션·등록 코드·이용 권한 (GONE)
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: 본문·배치 크기 한도 초과 (PAYLOAD_TOO_LARGE)
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: RULE_VIOLATION(수집·공유·이용 정책 조건 미충족, unmet_conditions) 또는 UNSUPPORTED_SCHEMA_VERSION
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: 호출 제한 (RATE_LIMITED)
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: STORAGE_UNAVAILABLE 또는 SERVICE_UNAVAILABLE
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Problem:
      $ref: './schemas/problem.schema.json'

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: {enum: [ready, not_ready]}
        checks:
          type: object
          additionalProperties: {enum: [ok, failed]}
        warnings:
          type: array
          description: 준비 상태를 바꾸지 않는 경고 코드 (예 storage_encryption_unsupported:RAW — S3_SSE를 요청했는데 스토리지가 지원하지 않음, 08번 요구사항 1.4)
          items: {type: string}

    Capabilities:
      type: object
      required: [api_version, schema_versions, gpu_enabled, processing_steps, report_formats, external_sources]
      properties:
        api_version: {type: string}
        schema_versions: {type: array, items: {type: string}}
        gpu_enabled: {type: boolean}
        processing_steps:
          type: array
          items: {enum: [META, PROXY, THUMBNAIL, SENSOR_PARSE, DEID, TAG, EMBED]}
        report_formats:
          type: array
          items: {enum: [PDF, XLSX, HWPX]}
        external_sources: {type: array, items: {type: string}}
        features:
          type: object
          additionalProperties: {type: boolean}

    TokenRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type: {const: client_credentials}
        client_id: {type: string, maxLength: 128}
        client_secret: {type: string, maxLength: 256}
        scope:
          type: string
          description: '공백으로 구분한 범위 (02번 요구사항 6: upload:write observation:write event:write asset:read status:read webhook:manage). 생략하면 자격증명에 허용된 전체 범위'

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        token_type: {const: Bearer}
        expires_in: {type: integer, minimum: 1}

    EnrollRequest:
      type: object
      additionalProperties: false
      required: [enrollment_code, agent_version, os]
      properties:
        enrollment_code: {type: string, minLength: 8, maxLength: 64}
        agent_version: {type: string, maxLength: 64}
        os: {enum: [windows, linux]}

    EnrollResponse:
      type: object
      required: [device_id, client_id, client_secret, token_endpoint]
      properties:
        device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        client_id: {type: string}
        client_secret: {type: string, description: 이 응답에서 한 번만 보인다. 서버는 해시만 저장한다.}
        token_endpoint: {const: /v1/auth/token}

    EnrollmentCode:
      type: object
      required: [code, expires_at]
      properties:
        code: {type: string}
        expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    Me:
      type: object
      required: [principal_kind, organization_id, org_type, roles, mfa]
      properties:
        principal_kind: {enum: [USER, DEVICE, API_KEY]}
        user_id: {$ref: './schemas/common.schema.json#/$defs/user_id'}
        device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        org_type: {$ref: './schemas/common.schema.json#/$defs/org_type'}
        roles: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/role'}}
        mfa: {type: boolean}

    ApiKeyCreate:
      type: object
      additionalProperties: false
      required: [name, scopes, expires_at]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        scopes:
          type: array
          minItems: 1
          items: {enum: [upload:write, observation:write, event:write, asset:read, status:read, webhook:manage]}
        expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    ApiKey:
      type: object
      required: [api_key_id, name, scopes, expires_at, revoked_at, created_at]
      properties:
        api_key_id: {$ref: './schemas/common.schema.json#/$defs/api_key_id'}
        name: {type: string}
        scopes: {type: array, items: {type: string}}
        expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        revoked_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    ApiKeyIssued:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [client_id, client_secret]
          properties:
            client_id: {type: string, description: api_key_id와 같다}
            client_secret: {type: string, description: 이 응답에서 한 번만 보인다. 서버는 해시만 저장한다.}

    AuditRecord:
      type: object
      required: [audit_id, occurred_at, actor_kind, action, result]
      properties:
        audit_id: {$ref: './schemas/common.schema.json#/$defs/audit_id'}
        occurred_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        actor_kind: {enum: [USER, DEVICE, API_KEY, SERVICE, MACHINE, ANONYMOUS, SYSTEM]}
        actor_id: {type: [string, 'null']}
        action: {type: string}
        target_type: {type: [string, 'null']}
        target_id: {type: [string, 'null']}
        result: {enum: [SUCCESS, DENIED, FAILED]}
        request_id: {type: [string, 'null']}
        reason: {type: [string, 'null']}

    ReprocessRequest:
      type: object
      additionalProperties: false
      required: [steps, reason]
      properties:
        steps:
          type: array
          minItems: 1
          uniqueItems: true
          items: {enum: [META, PROXY, THUMBNAIL, SENSOR_PARSE]}
        reason: {type: string, minLength: 2, maxLength: 500}

    ObservationMapping:
      type: object
      additionalProperties: false
      required: [format, columns]
      description: 07번 매핑 프로필. 형식·열 이름은 연계 카드로 확정한다 (확인 필요). 시각 형식은 Python strptime 표기
      properties:
        format: {enum: [csv, json_lines, mqtt_json]}
        delimiter: {type: string, minLength: 1, maxLength: 1}
        header_row: {type: integer, minimum: 1}
        timestamp:
          type: object
          additionalProperties: false
          required: [field]
          properties:
            field: {type: string, maxLength: 64}
            format: {type: string, maxLength: 64, description: '없으면 RFC 3339. 오프셋 없는 형식이면 장비의 source_timezone으로 변환'}
        missing_values: {type: array, items: {type: string, maxLength: 32}}
        topic_filter: {type: string, maxLength: 256, description: 'mqtt_json에서 구독할 토픽 (예: site/+/ctd)'}
        columns:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, metric]
            properties:
              field: {type: string, maxLength: 64}
              metric: {$ref: './schemas/common.schema.json#/$defs/metric_code'}
              unit: {type: string, maxLength: 32}
              depth_m: {type: number}
              channel: {type: string, maxLength: 32}
              quality_field: {type: string, maxLength: 64}

    ObservationMappingRecord:
      type: object
      required: [device_id, version, mapping, created_at]
      properties:
        device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        version: {type: integer, minimum: 1}
        mapping: {$ref: '#/components/schemas/ObservationMapping'}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    ObservationCorrection:
      type: object
      additionalProperties: false
      required: [source_system_id, metric, observed_at, value, reason]
      properties:
        source_system_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        metric: {$ref: './schemas/common.schema.json#/$defs/metric_code'}
        observed_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        depth_m: {type: [number, 'null']}
        channel: {type: [string, 'null'], maxLength: 32}
        value: {type: [number, 'null'], description: 정규화 단위 기준 새 값. null이면 결측으로 정정}
        quality_flag: {$ref: './schemas/common.schema.json#/$defs/observation_quality_flag'}
        reason: {type: string, minLength: 2, maxLength: 500}

    OrgUsage:
      type: object
      required: [organization_id, quota_bytes, usage_bytes, usage_ratio, breakdown]
      properties:
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        quota_bytes: {type: integer, minimum: 0}
        usage_bytes: {type: integer, minimum: 0, description: 'stored + quarantine + reserved + backup (domain.md 9장)'}
        usage_ratio: {type: number, minimum: 0}
        breakdown:
          type: object
          required: [stored_bytes, quarantine_bytes, reserved_bytes, backup_bytes]
          properties:
            stored_bytes: {type: integer, minimum: 0, description: 'RAW + PROCESSED + EVIDENCE 등록 객체'}
            quarantine_bytes: {type: integer, minimum: 0}
            reserved_bytes: {type: integer, minimum: 0, description: 진행 중 업로드 예약량}
            backup_bytes: {type: integer, minimum: 0, description: 기관이 신청한 백업 용량}

    CapacityForecast:
      type: object
      required: [capacity_bytes, threshold_ratio, lead_time_days, window_days, current_bytes, slope_bytes_per_day, reach_date, within_lead_time, history]
      properties:
        capacity_bytes: {type: [integer, 'null']}
        threshold_ratio: {type: number}
        lead_time_days: {type: integer}
        window_days: {type: integer}
        current_bytes: {type: integer}
        current_ratio: {type: [number, 'null']}
        slope_bytes_per_day: {type: [number, 'null'], description: 일별 증가량 추세 (스냅숏 2일 미만이면 null)}
        reach_date: {type: [string, 'null'], format: date, description: 설정 사용률 도달 예상일 (이미 넘었으면 오늘, 줄어들면 null)}
        within_lead_time: {type: boolean}
        note: {type: [string, 'null']}
        history:
          type: array
          items:
            type: object
            required: [day, total_bytes]
            properties:
              day: {type: string, format: date}
              total_bytes: {type: integer}

    UsageReport:
      type: object
      required: [organization_id, storage_by_zone, storage_by_tier, backup_target_bytes, requested_backup_bytes, processing_seconds, downloads]
      properties:
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        snapshot_day: {type: [string, 'null'], format: date, description: 저장량 기준 스냅숏 날짜 (그 달 마지막)}
        storage_by_zone: {type: object, additionalProperties: {type: integer}}
        storage_by_tier: {type: object, additionalProperties: {type: integer}}
        backup_target_bytes: {type: integer, description: 독립 백업 대상 용량 (PROTECTED·EVIDENCE·DATASET·DEID)}
        requested_backup_bytes: {type: integer, description: 기관이 신청한 백업 용량 (사용량에 포함)}
        processing_seconds:
          type: object
          required: [CPU, GPU]
          properties:
            CPU: {type: number}
            GPU: {type: number}
        downloads:
          type: object
          required: [url_count, url_bytes, distribution_count]
          properties:
            url_count: {type: integer}
            url_bytes: {type: integer, description: 발급한 다운로드 URL 대상 크기 합 (실제 전송량 아님)}
            distribution_count: {type: integer, description: 데이터셋 배포 발급 수 (이용기관이면 받은 것)}

    ModelCreate:
      type: object
      additionalProperties: false
      required: [name, version, sha256, license, weights_uri, training_data_terms]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,119}$'}
        version: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,59}$'}
        sha256: {$ref: './schemas/common.schema.json#/$defs/sha256'}
        license: {type: string, maxLength: 60, description: SPDX 식별자}
        weights_uri: {type: string, minLength: 1, maxLength: 400, description: 가중치 위치 (파일 이름 또는 저장소 참조)}
        training_data_terms: {type: string, minLength: 2, maxLength: 4000, description: 학습 데이터 이용 조건 검토 결과}

    ModelEntry:
      type: object
      required: [name, version, sha256, license, weights_uri, loadable, created_at]
      properties:
        name: {type: string}
        version: {type: string}
        sha256: {$ref: './schemas/common.schema.json#/$defs/sha256'}
        license: {type: [string, 'null']}
        weights_uri: {type: string}
        training_data_terms: {type: [string, 'null']}
        approved_by: {type: [string, 'null']}
        loadable: {type: boolean, description: 라이선스가 허용 목록에 있어 추론 백엔드가 로드할 수 있음}
        created_at: {type: string, format: date-time}

    BreakGlassGrant:
      type: object
      required: [grant_id, organization_id, target_type, target_id, reason, duration_s, status, requested_by, created_at]
      properties:
        grant_id: {$ref: './schemas/common.schema.json#/$defs/break_glass_id'}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        target_type: {enum: [ASSET, SESSION]}
        target_id: {type: string}
        reason: {type: string}
        duration_s: {type: integer}
        status: {enum: [REQUESTED, ACTIVE, EXPIRED, DENIED], description: ACTIVE라도 expires_at이 지나면 EXPIRED로 보인다}
        requested_by: {type: string}
        approved_by: {type: [string, 'null']}
        starts_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}

    BackupRun:
      type: object
      required: [backup_run_id, status, started_at, object_count, copied_count, skipped_count, total_bytes, copied_bytes]
      properties:
        backup_run_id: {$ref: './schemas/common.schema.json#/$defs/backup_run_id'}
        status: {enum: [RUNNING, SUCCEEDED, FAILED]}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        object_count: {type: integer, description: 백업 대상 객체 수 (backup_class=NONE인 RAW 제외)}
        copied_count: {type: integer, description: 이번에 복사한 객체 수 (증분)}
        skipped_count: {type: integer, description: 이미 같은 sha256으로 백업돼 있어 건너뛴 수}
        total_bytes: {type: integer}
        copied_bytes: {type: integer}
        table_count: {type: [integer, 'null']}
        db_dump_sha256: {type: [string, 'null']}
        failed_objects:
          type: array
          items:
            type: object
            required: [key, reason]
            properties:
              key: {type: string}
              reason: {type: string}
        error: {type: [string, 'null']}
        restore_test:
          type: [object, 'null']
          description: 최근 복원 시험 (make restore-test)
          properties:
            tested_at: {type: string, format: date-time}
            ok: {type: boolean}
            tables_checked: {type: integer}
            table_mismatches: {type: array, items: {type: object}}
            objects_checked: {type: integer}
            object_mismatches: {type: array, items: {type: object}}
            audit_chain_ok: {type: [boolean, 'null']}

    RetentionDryRun:
      type: object
      required: [generated_at, targets, total_count, total_bytes, excluded_legal_hold, warnings]
      properties:
        generated_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        targets:
          type: array
          items:
            type: object
            required: [target, count, bytes]
            properties:
              target: {type: string, description: 'RAW, PROXY, THUMBNAIL, CLIP, DEID, EVIDENCE, DATASET, QUARANTINE:<사유>'}
              count: {type: integer, minimum: 0}
              bytes: {type: integer, minimum: 0}
        total_count: {type: integer, minimum: 0}
        total_bytes: {type: integer, minimum: 0}
        excluded_legal_hold: {type: integer, minimum: 0}
        warnings:
          type: array
          items:
            type: object
            required: [asset_id, reason]
            properties:
              asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
              reason: {enum: [CITED_BY_APPROVED_EVIDENCE, IN_DATASET_VERSION]}

    DeletionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 2, maxLength: 500}
        confirm_affected: {type: boolean, default: false, description: 증빙·보고서 영향 목록을 확인했다는 재확인. 이용 권한이 있는 데이터셋 포함은 우회하지 않는다}

    DeletionCertificate:
      type: object
      required: [certificate_id, organization_id, scope, target_id, requested_by, deleted_at, objects, backup_copies_expire_at]
      properties:
        certificate_id: {$ref: './schemas/common.schema.json#/$defs/deletion_certificate_id'}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        scope: {enum: [ASSET, SESSION, RETENTION]}
        target_id: {type: string}
        reason: {type: string}
        requested_by: {type: string}
        deleted_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        objects:
          type: array
          items:
            type: object
            required: [asset_id, object_key, checksum_sha256, byte_size]
            properties:
              asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
              object_key: {type: string}
              checksum_sha256: {$ref: './schemas/common.schema.json#/$defs/sha256'}
              byte_size: {type: integer, minimum: 0}
        backup_copies_expire_at:
          oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]
          description: 독립 백업에 남은 사본이 백업 보존 주기가 끝나 사라지는 날짜 (요구사항 5.2). 백업 대상이 아니면 null

    WatchRuleCode:
      enum: [HEARTBEAT_MISSING, INGEST_LAG, SESSION_NO_DATA, VOLUME_DROP, UPLOAD_FAILURE_RATE, PROCESSING_BACKLOG, QUARANTINE_SURGE, STORAGE_FORECAST, OPENAPI_FAILURE, OBSERVATION_LAG, CLOCK_OFFSET, LOCAL_DISK_LOW, HARDWARE_SIGNAL]

    WatchRule:
      type: object
      required: [rule_code, enabled, severity, params, notify_org, notify_operator, channels, realert_interval_s]
      properties:
        rule_code: {$ref: '#/components/schemas/WatchRuleCode'}
        description: {type: string}
        enabled: {type: boolean}
        severity: {$ref: './schemas/common.schema.json#/$defs/event_severity'}
        params: {type: object}
        notify_org: {type: boolean, description: 제공기관 ORG_ADMIN에게 알림}
        notify_operator: {type: boolean}
        channels: {type: array, items: {enum: [EMAIL, WEBHOOK]}}
        realert_interval_s: {type: integer, minimum: 60}
        data_source_ready: {type: boolean, description: "false면 아직 신호원이 없어 평가하지 않는다 (12번 Open API, 15번 엣지)"}
        updated_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    HardwareSignal:
      type: object
      additionalProperties: false
      required: [host, kind, status, observed_at]
      properties:
        host: {type: string, maxLength: 120}
        kind: {enum: [DISK, SMART, TEMPERATURE, POWER, UPS, OTHER]}
        component: {type: string, maxLength: 120, description: '예: /dev/sda, gpu0'}
        value: {type: [number, 'null']}
        unit: {type: [string, 'null'], maxLength: 32}
        status: {enum: [OK, WARNING, CRITICAL]}
        detail: {type: string, maxLength: 500}
        observed_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    InspectionCycle:
      enum: [DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY]

    InspectionResult:
      enum: [PASS, FAIL, NOT_APPLICABLE, AUTO_UNAVAILABLE]

    InspectionItemTemplate:
      type: object
      required: [cycle, item_code, title, auto]
      properties:
        cycle: {$ref: '#/components/schemas/InspectionCycle'}
        item_code: {type: string}
        title: {type: string}
        auto: {type: boolean, description: 서버가 결과를 자동으로 채우는 항목}

    Inspection:
      type: object
      required: [inspection_id, cycle, period_key, status, due_at, items, evidence, created_at]
      properties:
        inspection_id: {$ref: './schemas/common.schema.json#/$defs/inspection_id'}
        cycle: {$ref: '#/components/schemas/InspectionCycle'}
        period_key: {type: string}
        status: {enum: [IN_PROGRESS, COMPLETED]}
        assignee: {type: [string, 'null']}
        due_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        note: {type: [string, 'null']}
        items:
          type: array
          items:
            type: object
            required: [item_code, title, auto]
            properties:
              item_code: {type: string}
              title: {type: string}
              auto: {type: boolean}
              result: {oneOf: [{$ref: '#/components/schemas/InspectionResult'}, {type: 'null'}]}
              note: {type: [string, 'null']}
              auto_detail: {type: [object, 'null']}
        evidence:
          type: array
          items:
            type: object
            required: [evidence_id, filename, byte_size, checksum_sha256]
            properties:
              evidence_id: {type: string}
              item_code: {type: [string, 'null']}
              filename: {type: string}
              byte_size: {type: integer}
              checksum_sha256: {$ref: './schemas/common.schema.json#/$defs/sha256'}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        completed_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        completed_by: {type: [string, 'null']}

    DeidReview:
      type: object
      required: [review_id, original_asset_id, deid_asset_id, reviewer_id, risk_level, samples, status, created_at]
      properties:
        review_id: {$ref: './schemas/common.schema.json#/$defs/review_id'}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        session_id: {type: [string, 'null']}
        original_asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        deid_asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        reviewer_id: {type: string}
        risk_level: {enum: [LOW, MEDIUM, HIGH]}
        samples: {type: array, items: {type: number}, description: 표본 시각(초)}
        recheck: {type: boolean}
        status: {enum: [ASSIGNED, PASSED, MISSED, REJECTED]}
        missed: {type: array, items: {type: object}}
        manual_regions: {type: array, items: {type: object}}
        note: {type: [string, 'null']}
        decided_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        processing: {type: object, description: '처리 이력 — 모델·파라미터·탐지 수·처리 시각 (적정성 보증 아님)'}

    AssetTags:
      type: object
      required: [asset_id, tags, edits]
      properties:
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        tags:
          type: array
          items:
            type: object
            required: [tag, source]
            properties:
              tag: {type: string}
              t_offset: {type: [number, 'null']}
              confidence: {type: [number, 'null']}
              source: {enum: [MODEL, HUMAN]}
              model_ref: {type: [string, 'null']}
        edits:
          type: array
          items:
            type: object
            required: [action, tag, edited_by, edited_at]
            properties:
              action: {enum: [ADD, REMOVE]}
              tag: {type: string}
              edited_by: {type: string}
              edited_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    ExternalSourceCreate:
      allOf: [{$ref: '#/components/schemas/ExternalSourceBody'}]
      unevaluatedProperties: false

    ExternalSourceBody:
      type: object
      required: [source_id, name, adapter_kind, interval_s, stations, field_mapping, attribution, redistribution_allowed]
      properties:
        source_id: {type: string, pattern: '^[a-z][a-z0-9_-]{1,59}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        adapter_kind: {enum: [MOCK], description: 명세가 확인된 실제 어댑터가 생기면 값을 더한다}
        endpoint: {type: [string, 'null'], maxLength: 400}
        secret_ref: {type: [string, 'null'], maxLength: 120, description: 인증키가 든 비밀 저장소·환경 변수 이름 (값 아님)}
        interval_s: {type: integer, minimum: 60}
        max_window_s: {type: integer, minimum: 600, default: 86400}
        rate_limit_per_min: {type: [integer, 'null'], minimum: 1}
        supports_backfill: {type: boolean, default: true}
        stations:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [code, name, lat, lon]
            properties:
              code: {type: string, maxLength: 60}
              name: {type: string, maxLength: 120}
              lat: {type: number, minimum: -90, maximum: 90}
              lon: {type: number, minimum: -180, maximum: 180}
        field_mapping:
          type: object
          additionalProperties: false
          required: [station_path, time_path, metrics]
          properties:
            station_path: {type: string}
            time_path: {type: string}
            metrics:
              type: object
              description: '관측 항목 코드(03번) → {path, unit}'
              additionalProperties:
                type: object
                additionalProperties: false
                required: [path, unit]
                properties:
                  path: {type: string}
                  unit: {type: string}
        attribution: {type: string, minLength: 1, maxLength: 500, description: 화면·보고서 출처 표기 문구}
        redistribution_allowed: {type: boolean, description: false면 L2 이상 공유 산출물·데이터셋·DCAT에 넣지 않는다}
        options: {type: object}

    ExternalSource:
      allOf:
        - $ref: '#/components/schemas/ExternalSourceBody'
        - type: object
          required: [spec_status, enabled, consecutive_failures]
          properties:
            spec_status: {enum: [VERIFIED, NEEDS_CONFIRMATION]}
            enabled: {type: boolean}
            collected_until: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
            last_success_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
            consecutive_failures: {type: integer, minimum: 0}
            last_error: {type: [string, 'null']}

    Incident:
      type: object
      required: [incident_id, rule_code, severity, status, opened_at, summary]
      properties:
        incident_id: {$ref: './schemas/common.schema.json#/$defs/incident_id'}
        organization_id: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/organization_id'}, {type: 'null'}]}
        device_id: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/device_id'}, {type: 'null'}]}
        session_id: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/session_id'}, {type: 'null'}]}
        rule_code: {$ref: '#/components/schemas/WatchRuleCode'}
        severity: {$ref: './schemas/common.schema.json#/$defs/event_severity'}
        status: {enum: [OPEN, ACKNOWLEDGED, RESOLVED]}
        summary: {type: string}
        guidance: {type: string, description: 조치 안내}
        opened_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        acknowledged_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        resolved_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        assignee: {type: [string, 'null']}
        memo: {type: [string, 'null']}

    Project:
      type: object
      required: [project_id, name, status]
      properties:
        project_id: {$ref: './schemas/common.schema.json#/$defs/project_id'}
        name: {type: string}
        status: {enum: [PLANNED, ACTIVE, CLOSED]}

    SessionCreate:
      type: object
      additionalProperties: false
      required: [project_id, label, title, starts_at]
      properties:
        project_id: {$ref: './schemas/common.schema.json#/$defs/project_id'}
        label: {type: string, minLength: 1, maxLength: 120, description: 기관 안에서 유일한 회차 표시값 (폴더 이름 규칙과 맞춘다)}
        title: {type: string, minLength: 1, maxLength: 200}
        starts_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        ends_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        site: {type: string, maxLength: 200}
        note: {type: string, maxLength: 2000}
        device_ids:
          type: array
          description: 이 회차에 데이터를 낼 원천 장비 (실증 예정일 무수집 감시에 쓴다, 11번)
          items: {$ref: './schemas/common.schema.json#/$defs/device_id'}

    Session:
      type: object
      required: [session_id, project_id, label, title, starts_at, created_at]
      properties:
        session_id: {$ref: './schemas/common.schema.json#/$defs/session_id'}
        project_id: {$ref: './schemas/common.schema.json#/$defs/project_id'}
        label: {type: string}
        title: {type: string}
        starts_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        ends_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        site: {type: [string, 'null']}
        note: {type: [string, 'null']}
        device_ids: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/device_id'}}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    EvidenceRef:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, asset_id]
          properties:
            kind: {const: ASSET}
            asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
            from_offset_s: {type: number, minimum: 0}
            to_offset_s: {type: number, minimum: 0}
        - type: object
          additionalProperties: false
          required: [kind, event_id]
          properties:
            kind: {const: EVENT}
            event_id: {$ref: './schemas/common.schema.json#/$defs/event_id'}
        - type: object
          additionalProperties: false
          required: [kind, source_system_id, metric, from, to]
          properties:
            kind: {const: OBSERVATION_RANGE}
            source_system_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
            metric: {$ref: './schemas/common.schema.json#/$defs/metric_code'}
            from: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
            to: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    SessionRecordCreate:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind: {enum: [LOG, TEST, NOTE]}
        title: {type: string, minLength: 1, maxLength: 200}
        test_item: {type: string, maxLength: 200}
        conditions: {type: string, maxLength: 2000}
        result: {type: string, maxLength: 4000}
        note: {type: string, maxLength: 4000}
        evidence_refs: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/EvidenceRef'}}

    SessionRecordUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: {enum: [LOG, TEST, NOTE]}
        title: {type: string, minLength: 1, maxLength: 200}
        test_item: {type: [string, 'null'], maxLength: 200}
        conditions: {type: [string, 'null'], maxLength: 2000}
        result: {type: [string, 'null'], maxLength: 4000}
        note: {type: [string, 'null'], maxLength: 4000}
        evidence_refs: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/EvidenceRef'}}

    EvidenceDamage:
      type: object
      required: [asset_id, reason, detected_at]
      properties:
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        reason: {enum: [DELETED, QUARANTINED, REPROCESSED]}
        detected_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    SessionRecord:
      type: object
      required: [record_id, session_id, kind, title, evidence_refs, created_at, created_by, version, status,
                 evidence_damaged]
      properties:
        record_id: {$ref: './schemas/common.schema.json#/$defs/record_id'}
        session_id: {$ref: './schemas/common.schema.json#/$defs/session_id'}
        kind: {enum: [LOG, TEST, NOTE]}
        title: {type: string}
        test_item: {type: [string, 'null']}
        conditions: {type: [string, 'null']}
        result: {type: [string, 'null']}
        note: {type: [string, 'null']}
        evidence_refs: {type: array, items: {$ref: '#/components/schemas/EvidenceRef'}}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        created_by: {type: string, description: 이 버전을 쓴 주체}
        version: {type: integer, minimum: 1}
        latest_version: {type: integer, minimum: 1}
        status: {enum: [DRAFT, APPROVED], description: 버전 상태. 승인된 버전은 바뀌지 않는다}
        approved_by: {type: [string, 'null']}
        approved_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        evidence_damaged: {type: boolean}
        damage: {type: array, items: {$ref: '#/components/schemas/EvidenceDamage'}}

    TemplateCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{1,59}$'

    MetricDefinitionCreate:
      allOf: [{$ref: '#/components/schemas/MetricDefinitionBody'}]
      unevaluatedProperties: false

    MetricDefinitionBody:
      type: object
      required: [code, name, kind, params]
      properties:
        code: {$ref: '#/components/schemas/TemplateCode'}
        name: {type: string, maxLength: 200}
        description: {type: [string, 'null'], maxLength: 2000}
        unit: {type: [string, 'null'], maxLength: 32}
        kind:
          enum: [EVENT_COUNT, EVENT_RATIO, OBSERVATION_STAT, VIDEO_HOURS]
          description: >-
            EVENT_COUNT(params.event_codes), EVENT_RATIO(numerator_codes / denominator_codes),
            OBSERVATION_STAT(metric, stat=mean|min|max|count), VIDEO_HOURS(원본 영상 길이 합)
        params: {type: object}

    MetricDefinition:
      allOf:
        - $ref: '#/components/schemas/MetricDefinitionBody'
        - type: object
          required: [version, formula, created_at]
          properties:
            version: {type: integer, minimum: 1}
            formula: {type: string, description: 사람이 읽는 계산식}
            created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    MetricResult:
      type: object
      required: [metric_code, metric_version, status, value, formula, input_count, missing_count, sources]
      properties:
        metric_code: {$ref: '#/components/schemas/TemplateCode'}
        metric_version: {type: integer}
        name: {type: string}
        unit: {type: [string, 'null']}
        status:
          enum: [OK, NO_DATA, NEEDS_VERIFICATION]
          description: NO_DATA=값을 추정하지 않음, NEEDS_VERIFICATION=모델 결과만으로 계산(확정값으로 내보내지 않음)
        value: {type: [number, 'null']}
        formula: {type: string}
        input_count: {type: integer, minimum: 0}
        missing_count: {type: integer, minimum: 0}
        sources:
          type: object
          properties:
            event_ids: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/event_id'}}
            asset_ids: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/asset_id'}}
            observation_ranges: {type: array, items: {type: object}}
        computed_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    ReportTemplateCreate:
      allOf: [{$ref: '#/components/schemas/ReportTemplateBody'}]
      unevaluatedProperties: false

    ReportTemplateBody:
      type: object
      required: [code, name, sections]
      properties:
        code: {$ref: '#/components/schemas/TemplateCode'}
        name: {type: string, maxLength: 200}
        scope: {enum: [SESSION, PERIOD], default: SESSION}
        sections:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [kind, title]
            properties:
              kind: {enum: [TEXT, FIELDS, METRICS, RECORDS]}
              title: {type: string, maxLength: 200}
              text: {type: string, maxLength: 10000, description: 'TEXT: {{session.label}} 같은 변수 사용'}
              fields:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [key, label]
                  properties:
                    key: {type: string, pattern: '^[a-z][a-z0-9_]{0,59}$'}
                    label: {type: string, maxLength: 200}
                    auto: {type: string, maxLength: 2000, description: 자동값 식 (변수 치환)}
              metrics: {type: array, items: {$ref: '#/components/schemas/TemplateCode'}}

    ReportTemplate:
      allOf:
        - $ref: '#/components/schemas/ReportTemplateBody'
        - type: object
          required: [version, has_hwpx, created_at]
          properties:
            version: {type: integer, minimum: 1}
            has_hwpx: {type: boolean}
            hwpx_sha256: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/sha256'}, {type: 'null'}]}
            created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    ReportField:
      type: object
      required: [key, label, auto_value, value, edited]
      properties:
        key: {type: string}
        label: {type: string}
        auto_value: {type: [string, 'null']}
        value: {type: [string, 'null']}
        edited: {type: boolean}
        history:
          type: array
          items:
            type: object
            required: [previous, value, edited_by, edited_at]
            properties:
              previous: {type: [string, 'null']}
              value: {type: [string, 'null']}
              edited_by: {type: string}
              edited_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    Report:
      type: object
      required: [report_id, organization_id, project_id, title, template_code, template_version, version, status,
                 generated_at, data_as_of, fields, metrics, evidence_damaged, created_at]
      properties:
        report_id: {$ref: './schemas/common.schema.json#/$defs/report_id'}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        project_id: {$ref: './schemas/common.schema.json#/$defs/project_id'}
        session_id: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/session_id'}, {type: 'null'}]}
        period_from: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        period_to: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        title: {type: string}
        template_code: {$ref: '#/components/schemas/TemplateCode'}
        template_version: {type: integer}
        version: {type: integer, minimum: 1}
        latest_version: {type: integer, minimum: 1}
        status: {$ref: './schemas/common.schema.json#/$defs/report_status'}
        generated_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        data_as_of: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        fields: {type: array, items: {$ref: '#/components/schemas/ReportField'}}
        metrics: {type: array, items: {$ref: '#/components/schemas/MetricResult'}}
        record_ids: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/record_id'}}
        evidence_damaged: {type: boolean}
        damage: {type: array, items: {$ref: '#/components/schemas/EvidenceDamage'}}
        approved_by: {type: [string, 'null']}
        approved_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        snapshot_sha256: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/sha256'}, {type: 'null'}]}
        submitted_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    MetricTrace:
      type: object
      required: [metric, records, events, observation_ranges, assets, hidden_count]
      properties:
        metric: {$ref: '#/components/schemas/MetricResult'}
        records:
          type: array
          items:
            type: object
            required: [record_id, version, title]
            properties:
              record_id: {$ref: './schemas/common.schema.json#/$defs/record_id'}
              version: {type: integer}
              title: {type: string}
        events:
          type: array
          items:
            type: object
            required: [event_id, event_code, asset_ids]
            properties:
              event_id: {$ref: './schemas/common.schema.json#/$defs/event_id'}
              event_code: {type: string}
              source: {type: string}
              human_verified: {type: boolean}
              asset_ids: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/asset_id'}}
        observation_ranges: {type: array, items: {type: object}}
        assets:
          type: array
          items:
            type: object
            required: [asset_id, variant, originals]
            properties:
              asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
              variant: {type: string}
              ingest_status: {type: string}
              originals: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/asset_id'}, description: 계보를 거슬러 올라간 원본}
        hidden_count: {type: integer, minimum: 0, description: 권한 범위 밖이라 보이지 않는 근거 수}

    DeviceCreate:
      type: object
      additionalProperties: false
      required: [name, kind, device_type, local_copy_policy]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        kind: {enum: [SOURCE, COLLECTOR], description: 'SOURCE=원천 장비, COLLECTOR=에이전트 설치 장비 (domain.md 1장)'}
        device_type: {enum: [CAMERA, NVR, SENSOR, EXTERNAL_STATION, AGENT_PC, EDGE_BOX, SERVER, OTHER]}
        collector_device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        project_id: {$ref: './schemas/common.schema.json#/$defs/project_id'}
        local_copy_policy: {$ref: './schemas/common.schema.json#/$defs/local_copy_policy'}
        local_retention_days: {type: [integer, 'null'], minimum: 0}
        expected_interval_s: {type: [integer, 'null'], minimum: 1}

    Agreement:
      type: object
      required: [agreement_id, organization_id, tier, reference, valid_from, valid_until, allowed_purposes, status, in_effect]
      properties:
        agreement_id: {$ref: './schemas/common.schema.json#/$defs/agreement_id'}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        tier: {enum: [TIER1, TIER2], description: TIER1=수집·관리(L0·L1), TIER2=공동활용 제공(L2~L4)}
        reference: {type: string, description: 약정서 참조 (문서 번호 등, 원본은 저장하지 않음)}
        valid_from: {type: string, format: date-time}
        valid_until: {type: [string, 'null'], format: date-time}
        allowed_purposes: {type: array, items: {$ref: './schemas/common.schema.json#/$defs/purpose'}}
        status: {type: string}
        in_effect: {type: boolean, description: 지금 유효한가 (ACTIVE이고 유효기간 안)}
        created_by: {type: string}
        created_at: {type: string, format: date-time}

    AgreementCreate:
      type: object
      additionalProperties: false
      required: [organization_id, tier, reference, valid_from]
      properties:
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        tier: {enum: [TIER1, TIER2]}
        reference: {type: string, minLength: 2, maxLength: 200}
        valid_from: {type: string, format: date-time}
        valid_until: {type: [string, 'null'], format: date-time}
        allowed_purposes:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {$ref: './schemas/common.schema.json#/$defs/purpose'}

    IntegrationCardWrite:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        content: {$ref: './schemas/integration-card.schema.json'}

    IntegrationCard:
      type: object
      required: [integration_card_id, version, organization_id, device_id, content, created_by, created_at]
      properties:
        integration_card_id: {$ref: './schemas/common.schema.json#/$defs/integration_card_id'}
        version: {type: integer, minimum: 1}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        device_id: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/device_id'}, {type: 'null'}]}
        content: {$ref: './schemas/integration-card.schema.json'}
        linked_policies:
          type: array
          description: 이 카드에서 만든 장비 정책 버전
          items:
            type: object
            required: [device_id, version]
            properties:
              device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
              version: {type: integer}
        created_by: {type: string}
        created_at: {type: string, format: date-time}

    Device:
      type: object
      required: [device_id, name, kind, device_type, status, collection_mode, local_copy_policy]
      properties:
        device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        name: {type: string}
        kind: {enum: [SOURCE, COLLECTOR]}
        device_type: {enum: [CAMERA, NVR, SENSOR, EXTERNAL_STATION, AGENT_PC, EDGE_BOX, SERVER, OTHER]}
        collector_device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        expected_interval_s: {type: [integer, 'null']}
        project_id: {$ref: './schemas/common.schema.json#/$defs/project_id'}
        status: {enum: [PENDING_ENROLLMENT, ACTIVE, REVOKED]}
        collection_mode: {$ref: './schemas/common.schema.json#/$defs/collection_mode'}
        local_copy_policy: {$ref: './schemas/common.schema.json#/$defs/local_copy_policy'}
        local_retention_days: {type: [integer, 'null']}
        center_copy_may_be_only_copy: {type: boolean, description: local_copy_policy가 ROTATING·NONE·UNKNOWN이면 true}
        last_heartbeat_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}

    AgentHealth:
      type: object
      required: [device_id, status]
      properties:
        device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        status: {enum: [OK, STALE, ERROR, NEVER_SEEN]}
        last_heartbeat_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        last_success_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        queue_items: {type: integer, minimum: 0}
        queue_bytes: {type: integer, minimum: 0}
        last_error_code: {type: [string, 'null']}
        policy_version_applied: {type: [string, 'null']}
        policy_version_current: {type: string}
        open_alerts: {type: integer, minimum: 0}
        last_registered_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        last_observation_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        expected_interval_s: {type: [integer, 'null']}
        lag_s: {type: [integer, 'null'], description: 현재 시각 − 마지막 정상 등록(관측값 장비는 마지막 관측) 시각}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        name: {type: string}
        kind: {enum: [COLLECTOR, SOURCE]}
        heartbeat_lag_s: {type: [integer, 'null']}
        observation_lag_s: {type: [integer, 'null'], description: "현재 시각 − 마지막 관측 시각 (관측값 장비만)"}
        next_expected_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}], description: "마지막 수신 + 기대 수집 주기"}
        clock_offset_ms: {type: [integer, 'null']}
        policy_mismatch: {type: boolean, description: 하트비트의 적용 정책 버전이 서버 현재 버전과 다름}
        disk_free_bytes: {type: [integer, 'null']}

    SchemaIndex:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, version]
            properties:
              name: {type: string}
              version: {type: string}

    CodeTable:
      type: object
      required: [table, version, items]
      properties:
        table: {type: string}
        version: {type: string}
        items: {type: array, items: {type: object}}

    OrgEventSubcodeCreate:
      type: object
      additionalProperties: false
      required: [code, label]
      properties:
        code:
          type: string
          maxLength: 80
          pattern: '^[A-Z][A-Z0-9_]{1,39}\.[a-z0-9_]{1,40}$'
          examples: [VESSEL.small_boat]
        label:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[^\x00-\x1f\x7f]*[^\s\x00-\x1f\x7f][^\x00-\x1f\x7f]*$'
          description: 공백만이거나 제어 문자가 들어간 이름은 거부한다.

    OrgEventSubcode:
      type: object
      additionalProperties: false
      required: [code, label, organization_specific]
      properties:
        code: {type: string, maxLength: 80}
        label: {type: string, minLength: 1, maxLength: 120}
        organization_specific: {type: boolean, const: true}

    ValidateRequest:
      type: object
      additionalProperties: false
      required: [contract, document]
      properties:
        contract: {enum: [upload-manifest, observation-batch, event]}
        document: {type: object}

    ValidateResult:
      type: object
      required: [valid, problems]
      properties:
        valid: {type: boolean}
        problems:
          type: array
          items:
            type: object
            required: [pointer, code, message, severity]
            properties:
              pointer: {type: string}
              code: {type: string}
              message: {type: string}
              severity: {enum: [ERROR, WARNING]}

    PartUrl:
      type: object
      required: [part_number, url, expires_at]
      properties:
        part_number: {type: integer, minimum: 1, maximum: 10000}
        url: {type: string, format: uri, description: 사전 서명 URL. 로그에 남기지 않는다.}
        expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    UploadCreated:
      type: object
      required: [status, asset_id]
      properties:
        status: {enum: [UPLOAD_CREATED, METADATA_ONLY_REGISTERED, ALREADY_REGISTERED]}
        upload_id: {$ref: './schemas/common.schema.json#/$defs/upload_id'}
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        part_size: {type: integer, minimum: 1}
        part_count: {type: integer, minimum: 1}
        parts: {type: array, items: {$ref: '#/components/schemas/PartUrl'}}
        expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
      allOf:
        - if: {properties: {status: {const: UPLOAD_CREATED}}}
          then: {required: [upload_id, part_size, part_count, parts, expires_at]}

    PartList:
      type: object
      required: [upload_id, part_size, part_count, completed_parts, pending_parts, expires_at]
      properties:
        upload_id: {$ref: './schemas/common.schema.json#/$defs/upload_id'}
        part_size: {type: integer, minimum: 1}
        part_count: {type: integer, minimum: 1}
        completed_parts:
          type: array
          items:
            type: object
            required: [part_number, etag, size]
            properties:
              part_number: {type: integer, minimum: 1}
              etag: {type: string}
              size: {type: integer, minimum: 0}
        pending_parts: {type: array, items: {$ref: '#/components/schemas/PartUrl'}}
        expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    CompleteRequest:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [part_number, etag]
            properties:
              part_number: {type: integer, minimum: 1}
              etag: {type: string, minLength: 1}

    UploadStatus:
      type: object
      required: [upload_id, ingest_status, parts_completed, part_count, created_at]
      properties:
        upload_id: {$ref: './schemas/common.schema.json#/$defs/upload_id'}
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        ingest_status: {$ref: './schemas/common.schema.json#/$defs/ingest_status'}
        quarantine_reason: {$ref: './schemas/common.schema.json#/$defs/quarantine_reason'}
        parts_completed: {type: integer, minimum: 0}
        part_count: {type: integer, minimum: 0}
        bytes_received: {type: integer, minimum: 0}
        error_code: {type: [string, 'null']}
        expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    AssetPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        session_id: {$ref: './schemas/common.schema.json#/$defs/session_id'}
        data_role: {$ref: './schemas/common.schema.json#/$defs/data_role'}
        location_precision: {$ref: './schemas/common.schema.json#/$defs/location_precision'}
        reason: {type: string, minLength: 2, maxLength: 500}
      dependentRequired:
        data_role: [reason]

    Receipt:
      type: object
      required: [asset_id, checksum_sha256, byte_size, registered_at, integrity_log_entry_id, integrity_entry_hash]
      properties:
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        checksum_sha256: {$ref: './schemas/common.schema.json#/$defs/sha256'}
        byte_size: {type: integer, minimum: 0}
        registered_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        integrity_log_entry_id: {type: string}
        integrity_entry_hash: {$ref: './schemas/common.schema.json#/$defs/sha256'}

    LineageEdge:
      type: object
      required: [asset_id, relation, created_at]
      properties:
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        relation: {enum: [PROXY, THUMBNAIL, CLIP, DEID, LABEL, SENSOR_PARSE, DATASET_COPY, REPROCESS]}
        tool_version: {type: string}
        model_ref: {type: string}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    Lineage:
      type: object
      required: [asset_id, ancestors, descendants]
      properties:
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        ancestors: {type: array, items: {$ref: '#/components/schemas/LineageEdge'}}
        descendants: {type: array, items: {$ref: '#/components/schemas/LineageEdge'}}

    ClipRequest:
      type: object
      additionalProperties: false
      required: [start_s, end_s]
      properties:
        start_s: {type: number, minimum: 0, description: 원 영상 시작부터의 초}
        end_s: {type: number, exclusiveMinimum: 0, description: 원 영상 시작부터의 초. start_s보다 크고 영상 길이 이하}
        reason: {type: string, minLength: 2, maxLength: 500, description: 선택. 감사 로그(CLIP_EXPORT_REQUESTED)에 남는다}

    ClipJob:
      type: object
      required: [job_id, asset_id, start_s, end_s, status, requested_at]
      properties:
        job_id: {$ref: './schemas/common.schema.json#/$defs/job_id'}
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id', description: 잘라낸 원 영상}
        start_s: {type: number, minimum: 0}
        end_s: {type: number, exclusiveMinimum: 0}
        status: {enum: [QUEUED, RUNNING, DONE, FAILED], description: 작업 큐 상태 (FAILED는 재시도를 다 썼거나 다시 해도 같은 실패)}
        requested_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        clip_asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id', description: DONE일 때 결과 파생 자산 (삭제됐으면 없음)}
        error_code: {type: string, maxLength: 64, description: FAILED일 때 원인 코드 (예 SOURCE_UNAVAILABLE, CLIP_ENCODE_FAILED)}

    ShareRequestCreate:
      type: object
      additionalProperties: false
      required: [target_scope, reason]
      properties:
        target_scope: {$ref: './schemas/common.schema.json#/$defs/sharing_scope'}
        reason: {type: string, minLength: 2, maxLength: 1000}
        existing_grant_handling:
          enum: [REVOKE_NOW, KEEP_UNTIL_EXPIRY]
          description: 하향할 때 필수. 이미 부여된 이용 권한을 즉시 철회할지 만료까지 둘지

    ShareRequest:
      type: object
      required: [share_request_id, asset_id, target_scope, state, share_status]
      properties:
        share_request_id: {$ref: './schemas/common.schema.json#/$defs/share_request_id'}
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        from_scope: {$ref: './schemas/common.schema.json#/$defs/sharing_scope'}
        target_scope: {$ref: './schemas/common.schema.json#/$defs/sharing_scope'}
        state: {enum: [APPLIED, IN_REVIEW, DENIED], description: IN_REVIEW=운영자 승인 대기(L3·L4)}
        share_status: {$ref: './schemas/common.schema.json#/$defs/share_status'}
        reason: {type: string}
        existing_grant_handling: {enum: [REVOKE_NOW, KEEP_UNTIL_EXPIRY, null]}
        requested_by: {type: string}
        requested_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        decided_by: {type: [string, 'null']}
        decided_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        decision_reason: {type: [string, 'null']}

    ShareReview:
      type: object
      required: [asset_id, share_status, events]
      properties:
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        share_status: {$ref: './schemas/common.schema.json#/$defs/share_status'}
        legal_basis_ref: {type: [string, 'null']}
        max_scope: {$ref: './schemas/common.schema.json#/$defs/sharing_scope', description: 지금 조건으로 올릴 수 있는 가장 높은 등급(파생본 기준 안내)}
        derived:
          type: array
          items:
            type: object
            required: [asset_id, variant, share_status, sharing_scope]
            properties:
              asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
              variant: {type: string}
              share_status: {$ref: './schemas/common.schema.json#/$defs/share_status'}
              review_result: {type: [string, 'null']}
              privacy_status: {type: string}
              sharing_scope: {$ref: './schemas/common.schema.json#/$defs/sharing_scope'}
        events:
          type: array
          items:
            type: object
            required: [from_status, to_status, actor, at]
            properties:
              from_status: {type: string}
              to_status: {type: string}
              actor: {type: string}
              reason: {type: [string, 'null']}
              legal_basis_ref: {type: [string, 'null']}
              at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    ObservationRecord:
      type: object
      required: [source_system_id, metric, observed_at, value, quality_flag]
      properties:
        source_system_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
        metric: {$ref: './schemas/common.schema.json#/$defs/metric_code'}
        observed_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        value: {type: [number, 'null'], description: 정규화된 값 (단위는 unit)}
        unit: {type: [string, 'null'], description: 정규화 단위 (contracts/codes/units.json)}
        original_value: {type: [number, 'null']}
        original_unit: {type: [string, 'null']}
        quality_flag: {$ref: './schemas/common.schema.json#/$defs/observation_quality_flag'}
        source_timestamp: {type: [string, 'null']}
        clock_offset_ms: {type: [integer, 'null']}
        depth_m: {type: [number, 'null']}
        source_asset_id: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/asset_id'}, {type: 'null'}]}

    ObservationList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ObservationRecord'}}
        next_cursor: {type: [string, 'null']}

    ObservationAggregateList:
      type: object
      required: [interval, items]
      properties:
        interval: {type: string}
        items:
          type: array
          items:
            type: object
            required: [bucket_start, count, missing_count]
            properties:
              bucket_start: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
              min: {type: [number, 'null']}
              max: {type: [number, 'null']}
              avg: {type: [number, 'null']}
              count: {type: integer, minimum: 0}
              missing_count: {type: integer, minimum: 0}

    ObservationBatchResult:
      type: object
      required: [accepted, duplicates, rejected, results]
      properties:
        accepted: {type: integer, minimum: 0}
        duplicates: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        results:
          type: array
          items:
            type: object
            required: [index, status]
            properties:
              index: {type: integer, minimum: 0}
              status: {enum: [ACCEPTED, DUPLICATE, REJECTED]}
              reason: {$ref: './schemas/common.schema.json#/$defs/observation_reject_reason'}

    EventRecord:
      allOf:
        - $ref: './schemas/event.schema.json#/$defs/event_body'
        - type: object
          required: [event_id, organization_id, created_at, human_verified]
          properties:
            event_id: {$ref: './schemas/common.schema.json#/$defs/event_id'}
            organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
            created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
            verified_by: {$ref: './schemas/common.schema.json#/$defs/user_id'}
            verified_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
      unevaluatedProperties: false

    EventPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        human_verified: {const: true, description: 사람이 확인했다고 표시 (되돌리려면 새 이벤트)}
        ended_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        add_linked_asset_ids: {type: array, maxItems: 200, items: {$ref: './schemas/common.schema.json#/$defs/asset_id'}}
        note: {type: string, maxLength: 2000}

    IngestStatus:
      type: object
      required: [generated_at, devices]
      properties:
        generated_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        devices: {type: array, items: {$ref: '#/components/schemas/AgentHealth'}}
        open_incidents: {type: array, items: {$ref: '#/components/schemas/Incident'}, description: 열린 장애와 조치 안내}
        top_failure_reasons:
          type: array
          description: 최근 24시간 실패 원인 상위 (격리 사유·업로드 오류·처리 오류)
          items:
            type: object
            required: [source, code, count]
            properties:
              source: {enum: [QUARANTINE, UPLOAD, PROCESSING, AGENT]}
              code: {type: string}
              count: {type: integer, minimum: 1}

    QualityReport:
      type: object
      required: [counts_by_quality_status, top_reasons]
      properties:
        session_id: {$ref: './schemas/common.schema.json#/$defs/session_id'}
        from: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        to: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        counts_by_quality_status:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        top_reasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: {type: string}
              count: {type: integer, minimum: 0}

    WebhookSubscriptionCreate:
      type: object
      additionalProperties: false
      required: [url, event_types]
      properties:
        url: {type: string, format: uri, pattern: '^https://'}
        event_types:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: {enum: [upload.registered, upload.quarantined, asset.processed, share.status_changed, grant.revoked, incident.opened, incident.resolved]}

    WebhookSubscription:
      type: object
      required: [webhook_id, url, event_types, active, created_at]
      properties:
        webhook_id: {$ref: './schemas/common.schema.json#/$defs/webhook_id'}
        url: {type: string, format: uri}
        event_types: {type: array, items: {type: string}}
        active: {type: boolean}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        secret: {type: string, description: 등록 응답에서만 한 번 보인다}
        disabled_at: {type: [string, 'null'], format: date-time, description: 전송이 계속 실패해 꺼진 시각}
        disabled_reason: {type: [string, 'null']}

    DatasetVersionLineage:
      type: object
      required: [dataset_id, dataset_version_id, version, manifest_sha256, items, hidden_item_count]
      properties:
        dataset_id: {$ref: './schemas/common.schema.json#/$defs/dataset_id'}
        dataset_version_id: {$ref: './schemas/common.schema.json#/$defs/dataset_version_id'}
        version: {type: string}
        manifest_sha256: {$ref: './schemas/common.schema.json#/$defs/sha256'}
        hidden_item_count: {type: integer, minimum: 0, description: 볼 권한이 없는 다른 기관 항목 수}
        items:
          type: array
          items: {$ref: '#/components/schemas/DatasetLineageItem'}

    DatasetLineageItem:
      type: object
      required: [asset_id, path, organization_id, source_asset_id, chain, processing, reviews]
      properties:
        asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        path: {type: string}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        source_asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
        chain:
          type: array
          description: 데이터셋 항목에서 원본까지 (가까운 상위부터)
          items:
            type: object
            required: [asset_id, relation]
            properties:
              asset_id: {$ref: './schemas/common.schema.json#/$defs/asset_id'}
              relation: {type: string}
              variant: {type: string}
        processing:
          type: [object, 'null']
          description: 비식별 처리 기록 (모델 이름·버전·sha256·라이선스, 파라미터, 처리 시각). 처리 기록이 없는 항목은 null
          properties:
            model:
              type: object
              properties:
                name: {type: string}
                version: {type: string}
                sha256: {type: [string, 'null']}
                license: {type: [string, 'null']}
            params: {type: object}
            processed_at: {type: [string, 'null'], format: date-time}
        reviews:
          type: array
          description: 이 항목(비식별본)의 검수 배정·결정 (시간순)
          items:
            type: object
            required: [review_id, reviewer_id, status]
            properties:
              review_id: {$ref: './schemas/common.schema.json#/$defs/review_id'}
              reviewer_id: {type: string}
              status: {type: string}
              recheck: {type: boolean}
              decided_at: {type: [string, 'null'], format: date-time}
        review_result: {type: [string, 'null']}

    Dataset:
      type: object
      required: [dataset_id, title, versions]
      properties:
        dataset_id: {$ref: './schemas/common.schema.json#/$defs/dataset_id'}
        title: {type: string}
        published: {type: boolean}
        published_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        versions:
          type: array
          items:
            type: object
            required: [dataset_version_id, version, created_at]
            properties:
              dataset_version_id: {$ref: './schemas/common.schema.json#/$defs/dataset_version_id'}
              version: {type: string}
              created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
              status: {enum: [READY, BUILDING, FAILED], description: 이용기관에게는 READY만 보인다}
              build_error: {type: [string, 'null']}
        data_card: {$ref: './schemas/dataset-version-manifest.schema.json#/properties/data_card'}
        samples:
          type: array
          maxItems: 3
          description: 최신 READY 버전의 샘플 썸네일 (항목의 공유용 파생본에서 뽑은 JPEG 한 장씩, 단기 URL). 13번 요구사항 7.1
          items:
            type: object
            required: [url, expires_at]
            properties:
              url: {type: string, format: uri}
              expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    DatasetVersionCreate:
      type: object
      additionalProperties: false
      required: [version, item_asset_ids, data_card]
      properties:
        version: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
        item_asset_ids: {type: array, minItems: 1, maxItems: 20000, uniqueItems: true, items: {$ref: './schemas/common.schema.json#/$defs/asset_id'}}
        data_card: {$ref: './schemas/dataset-version-manifest.schema.json#/properties/data_card'}

    JobAccepted:
      type: object
      required: [job_id, status_url]
      properties:
        job_id: {$ref: './schemas/common.schema.json#/$defs/job_id'}
        status_url: {type: string}

    AccessRequest:
      type: object
      required: [access_request_id, dataset_version_id, purpose, status, created_at]
      properties:
        access_request_id: {$ref: './schemas/common.schema.json#/$defs/access_request_id'}
        dataset_version_id: {$ref: './schemas/common.schema.json#/$defs/dataset_version_id'}
        purpose: {$ref: './schemas/common.schema.json#/$defs/purpose'}
        status: {$ref: './schemas/common.schema.json#/$defs/grant_status'}
        pending_provider_approvals: {type: integer, minimum: 0}
        grant_id: {$ref: './schemas/common.schema.json#/$defs/grant_id'}
        grant_expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        grant_status: {$ref: './schemas/common.schema.json#/$defs/grant_status'}
        deadline_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime', description: 이때까지 결정이 없으면 거부}
        created_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}

    Grant:
      type: object
      required: [grant_id, dataset_version_id, status, starts_at, expires_at]
      properties:
        grant_id: {$ref: './schemas/common.schema.json#/$defs/grant_id'}
        access_request_id: {$ref: './schemas/common.schema.json#/$defs/access_request_id'}
        dataset_version_id: {$ref: './schemas/common.schema.json#/$defs/dataset_version_id'}
        organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
        status: {$ref: './schemas/common.schema.json#/$defs/grant_status'}
        starts_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        revoked_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        revoke_reason: {type: [string, 'null']}
        destruction_confirmed_at: {oneOf: [{$ref: './schemas/common.schema.json#/$defs/utc_datetime'}, {type: 'null'}]}
        notice: {type: string, description: 철회 시 '이미 받은 파일은 회수되지 않음' 안내}

    AccessDecision:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: {enum: [APPROVE, DENY]}
        reason: {type: string, minLength: 2, maxLength: 1000}

    DistributionCreate:
      type: object
      additionalProperties: false
      required: [grant_id]
      properties:
        grant_id: {$ref: './schemas/common.schema.json#/$defs/grant_id'}
        paths: {type: array, maxItems: 1000, items: {type: string, maxLength: 512}}

    Distribution:
      type: object
      required: [distribution_id, grant_id, dataset_version_id, expires_at, files, manifest]
      properties:
        distribution_id: {$ref: './schemas/common.schema.json#/$defs/distribution_id'}
        grant_id: {$ref: './schemas/common.schema.json#/$defs/grant_id'}
        dataset_version_id: {$ref: './schemas/common.schema.json#/$defs/dataset_version_id'}
        expires_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
        files:
          type: array
          items:
            type: object
            required: [path, url, byte_size, checksum_sha256]
            properties:
              path: {type: string}
              url: {type: string, format: uri, description: 사전 서명 URL (기본 5분). 로그에 남기지 않는다.}
              byte_size: {type: integer, minimum: 0}
              checksum_sha256: {$ref: './schemas/common.schema.json#/$defs/sha256'}
        manifest: {$ref: './schemas/dataset-version-manifest.schema.json'}
        recipient:
          type: object
          description: 받는 쪽 식별 정보 (파일 묶음의 RECIPIENT_MANIFEST.json에도 들어간다)
          properties:
            distribution_id: {$ref: './schemas/common.schema.json#/$defs/distribution_id'}
            grant_id: {$ref: './schemas/common.schema.json#/$defs/grant_id'}
            organization_id: {$ref: './schemas/common.schema.json#/$defs/organization_id'}
            requested_by: {type: string}
            issued_at: {$ref: './schemas/common.schema.json#/$defs/utc_datetime'}
