      tags: [datasets]
      operationId: createDistribution
      summary: 유효한 Grant로 단기 다운로드 URL과 매니페스트 발급
      x-freeze: G5
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DistributionCreate'}
      responses:
        '201':
          description: 배포 기록과 URL (기본 5분, 로그 금지)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Distribution'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
