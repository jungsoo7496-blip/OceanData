openapi: 3.1.0
info:
  title: 해양 실증데이터 플랫폼 API
  version: 1.0.0-draft.1
  summary: 기업·이용기관 연계 API v1 초안
  description: |
    domain.md(.kiro/steering)의 값과 규칙을 따르는 계약 초안이다.

    - `x-freeze: G1` 표시가 붙은 작업은 12월 G1(표준·API 동결) 회의에 올릴 기업 연계 API다.
      `x-freeze: G4`·`G5`는 공동활용 단계(가공·검수, 승인형 공급)에서 확정한다.
    - 포털 내부 화면용 API는 각 스펙의 설계 단계에서 이 파일에 먼저 추가한 뒤 구현한다 (계약 우선).
    - 오류는 RFC 9457 `application/problem+json`이며 프로그램 분기는 `code`로 한다.
    - 시각은 UTC(RFC 3339, Z). ID는 접두사 + ULID. 모든 응답에 `X-Request-Id` 헤더가 붙는다.
    - organization_id는 인증 정보로 정한다. 요청 본문·쿼리로 받지 않는다.
    - 대용량 바이너리는 API를 거치지 않고 사전 서명 URL로 스토리지에 직접 보낸다. URL은 로그에 남기지 않는다.
servers:
  - url: https://api.example.invalid
    description: 자리표시자 (운영 주소 미정)
security:
  - bearerAuth: []
tags:
  - name: system
    description: 상태·기능 조회
  - name: auth
    description: 기기·기관 서버 인증 (사용자는 Keycloak OIDC)
  - name: context
    description: 실증사업·회차·장비
  - name: contracts
    description: 스키마·코드표·사전 검증
  - name: uploads
    description: 업로드 세션·재개·완료
  - name: assets
    description: 자산 조회·영수증·계보
  - name: observations
    description: 센서 관측값
  - name: events
    description: 실증 이벤트
  - name: records
    description: 회차 기록 (실증일지)
  - name: reports
    description: 지표·보고서 (10번)
  - name: deid
    description: 비식별 검수·태그·장면 검색 (14번)
  - name: agents
    description: 에이전트 등록·하트비트
  - name: status
    description: 수집 현황·품질
  - name: webhooks
    description: 웹훅 구독
  - name: sharing
    description: 공유 등급 신청 (G4)
  - name: datasets
    description: 데이터셋·이용 신청·배포 (G5)

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealthz
      summary: 프로세스 생존 확인
      security: []
      x-freeze: G1
      responses:
        '200':
          description: 살아 있음
          content:
            application/json:
              schema: {type: object, properties: {status: {const: ok}}}
  /readyz:
    get:
      tags: [system]
      operationId: getReadyz
      summary: 의존 시스템(DB·S3·IdP) 준비 상태
      security: []
      x-freeze: G1
      responses:
        '200':
          description: 모두 정상
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503':
          description: 하나 이상 실패 (실패한 의존 시스템 이름만, 주소·자격증명 없음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}

  /v1/system/capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      summary: 켜진 기능·GPU 사용 여부·지원 스키마 버전
      x-freeze: G1
      responses:
        '200':
          description: 기능 상태 (설정값·주소는 넣지 않는다)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/auth/token:
    post:
      tags: [auth]
      operationId: issueToken
      summary: 기기 자격증명·API 키를 단기 액세스 토큰으로 교환
      description: 사용자 로그인은 Keycloak OIDC를 쓴다. 이 엔드포인트는 기기와 기관 서버용이다. 발급 방식은 보안 설계에서 확정한다 (tech.md 결정 대기).
      security: []
      x-freeze: G1
      x-status: draft
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: 단기 액세스 토큰 (기본 5분)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/agents/enroll:
    post:
      tags: [agents]
      operationId: enrollAgent
      summary: 1회용 등록 코드로 기기 자격증명 발급
      security: []
      x-freeze: G1
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrollRequest'}
      responses:
        '201':
          description: 기기 자격증명 (client_secret은 이 응답에서 한 번만 보인다)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrollResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '410': {$ref: '#/components/responses/Gone'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /v1/me:
    get:
      tags: [context]
      operationId: getMe
      summary: 현재 인증 주체의 기관·역할
      x-freeze: G1
      responses:
        '200':
          description: 인증 주체 정보
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/api-keys:
    get:
      tags: [auth]
      operationId: listApiKeys
      x-freeze: G1
      summary: 자기 기관 API 키 목록 (ORG_ADMIN, 비밀값 없음)
      x-status: draft
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: API 키 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ApiKey'}}
                  next_cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [auth]
      operationId: createApiKey
      x-freeze: G1
      summary: API 키 발급 (ORG_ADMIN, 다중 인증 필요, 비밀값은 한 번만 보인다)
      description: 02번 요구사항 6. 서버는 해시만 저장한다. 발급된 client_id·client_secret으로 /v1/auth/token에서 단기 토큰을 받는다.
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyCreate'}
      responses:
        '201':
          description: 발급된 키 (client_secret은 이 응답에서 한 번만 보인다)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyIssued'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/api-keys/{api_key_id}/revoke:
    parameters:
      - name: api_key_id
        in: path
        required: true
        schema: {$ref: './schemas/common.schema.json#/$defs/api_key_id'}
    post:
      tags: [auth]
      operationId: revokeApiKey
      x-freeze: G1
      summary: API 키 폐기 (ORG_ADMIN, 즉시 거부)
      x-status: draft
      responses:
        '200':
          description: 폐기된 키
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKey'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/devices/{device_id}/credentials/revoke:
    parameters:
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      tags: [agents]
      operationId: revokeDeviceCredentials
      x-freeze: G1
      summary: 수집기 자격증명 폐기 (ORG_ADMIN, 다중 인증 필요). 장비는 재등록 대기 상태가 된다
      x-status: draft
      responses:
        '200':
          description: 폐기 결과
          content:
            application/json:
              schema:
                type: object
                required: [device_id, revoked_credentials]
                properties:
                  device_id: {$ref: './schemas/common.schema.json#/$defs/device_id'}
                  revoked_credentials: {type: integer, minimum: 0}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/audit-logs:
    get:
      tags: [auth]
      operationId: listAuditLogs
      x-freeze: G1
      summary: 감사 기록 조회 (ORG_ADMIN은 자기 기관 관련 기록만, PLATFORM_OPERATOR는 전체)
      x-status: draft
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 감사 기록
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AuditRecord'}}
                  next_cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/projects:
    get:
      tags: [context]
      operationId: listProjects
      summary: 자기 기관의 실증사업 목록
      x-freeze: G1
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 실증사업 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Project'}}
                  next_cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /v1/sessions:
    get:
      tags: [context]
      operationId: listSessions
      summary: 실증회차 목록
      x-freeze: G1
      parameters:
        - name: project_id
          in: query
          schema: {$ref: './schemas/common.schema.json#/$defs/project_id'}
        - name: label
          in: query
          description: 회차 표시값으로 찾기 (감시 규칙의 폴더 이름 등)
          schema: {type: string, maxLength: 120}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: 회차 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Session'}}
                  next_cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [context]
      operationId: createSession
      summary: 실증회차 생성
      x-freeze: G1
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionCreate'}
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/sessions/{session_id}:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      tags: [context]
      operationId: getSession
      summary: 실증회차 상세
      x-freeze: G1
      responses:
        '200':
          description: 회차
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/sessions/{session_id}/records:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      tags: [records]
      operationId: listSessionRecords
      summary: 회차 기록 목록 (각 기록의 최신 버전)
      x-freeze: G1
      x-status: draft
      responses:
        '200':
          description: 기록 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SessionRecord'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [records]
      operationId: createSessionRecord
      summary: 회차 기록(실증일지·시험 결과) 작성과 근거 연결
      x-freeze: G1
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionRecordCreate'}
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/records/{record_id}:
    parameters:
      - {$ref: '#/components/parameters/RecordId'}
    get:
      tags: [records]
      operationId: getSessionRecord
      summary: 회차 기록 (최신 버전, version으로 특정 버전)
      x-freeze: G1
      x-status: draft
      parameters:
        - name: version
          in: query
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: 기록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [records]
      operationId: updateSessionRecord
      summary: 기록 수정 — 항상 새 버전으로 남고 이전 버전(승인본 포함)은 그대로 보존
      x-freeze: G1
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionRecordUpdate'}
      responses:
        '200':
          description: 새 버전
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/records/{record_id}/versions:
    parameters:
      - {$ref: '#/components/parameters/RecordId'}
    get:
      tags: [records]
      operationId: listSessionRecordVersions
      summary: 기록 수정 이력 (모든 버전)
      x-freeze: G1
      x-status: draft
      responses:
        '200':
          description: 버전 목록 (오래된 것부터)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SessionRecord'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/records/{record_id}/approve:
    parameters:
      - {$ref: '#/components/parameters/RecordId'}
    post:
      tags: [records]
      operationId: approveSessionRecord
      summary: 증빙 승인 (ORG_ADMIN). 최신 버전을 고정하고 인용 자산을 PROTECTED로
      x-freeze: G1
      x-status: draft
      responses:
        '200':
          description: 승인된 버전
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRecord'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /v1/metric-definitions:
    get:
      tags: [reports]
      operationId: listMetricDefinitions
      summary: 지표 정의 (코드별 모든 버전)
      x-freeze: G1
      x-status: draft
      responses:
        '200':
          description: 지표 정의
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/MetricDefinition'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [reports]
      operationId: createMetricDefinition
      summary: 지표 정의 등록 (운영자). 같은 코드면 새 버전
      x-freeze: G1
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MetricDefinitionCreate'}
      responses:
        '201':
          description: 등록된 버전
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricDefinition'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/report-templates:
    get:
      tags: [reports]
      operationId: listReportTemplates
      summary: 보고서 양식 (코드별 모든 버전)
      x-freeze: G1
      x-status: draft
      responses:
        '200':
          description: 양식
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ReportTemplate'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [reports]
      operationId: createReportTemplate
      summary: 보고서 양식 등록 (운영자). 같은 코드면 새 버전. 실제 관리기관 양식은 확보 후 등록
      x-freeze: G1
      x-status: draft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportTemplateCreate'}
      responses:
        '201':
          description: 등록된 버전
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportTemplate'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /v1/report-templates/{template_code}/versions/{version}/hwpx:
    parameters:
      - name: template_code
        in: path
        required: true
        schema: {$ref: '#/components/schemas/TemplateCode'}
      - name: version
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    put:
      tags: [reports]
      operationId: putReportTemplateHwpx
      summary: 양식 버전에 HWPX 원본 파일 첨부 (운영자). 본문의 {{변수}} 자리를 내보낼 때 치환한다
      x-freeze: G1
      x-status: draft
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 10485760}
      responses:
        '200':
          description: 첨부된 양식
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportTemplate'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /v1/reports:
    get:
      tags: [reports]
      operationId: listReports
      summary: 보고서 목록 (제공기관은 자기 기관, 관리기관 열람자는 배정 사업의 제출본)
      x-freeze: G1
      x-status: draft
      parameters:
        - name: session_id
          in: query
          schema: {$ref: './schemas/common.schema.json#/$defs/session_id'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
